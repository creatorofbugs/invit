<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="galaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09131d"/>
      <stop offset="35%" stop-color="#112236"/>
      <stop offset="70%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#3b2b4d"/>
    </linearGradient>
    <radialGradient id="chandelierGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#fde68a" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#09131d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="archClipGala">
      <path d="M40 460 L40 200 C40 130 90 60 200 40 C310 60 360 130 360 200 L360 460 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#archClipGala)">
    <!-- Heritage Midnight Ballroom Canvas -->
    <rect width="400" height="480" fill="url(#galaBg)"/>

    <!-- Magnificent Crystal Chandelier Aura -->
    <circle cx="200" cy="150" r="140" fill="url(#chandelierGlow)"/>

    <!-- GRAND ROYAL CRYSTAL CHANDELIER -->
    <!-- Hanging Chain -->
    <line x1="200" y1="40" x2="200" y2="100" stroke="#fde047" stroke-width="2"/>
    <!-- Chandelier Crown Ring -->
    <ellipse cx="200" cy="100" rx="35" ry="8" fill="#d97706" stroke="#fde047" stroke-width="1.5"/>

    <!-- Crystal Strands / Tiers -->
    <!-- Tier 1 -->
    <ellipse cx="200" cy="130" rx="65" ry="12" fill="none" stroke="#fde047" stroke-width="1.8"/>
    <!-- Tier 2 -->
    <ellipse cx="200" cy="160" rx="45" ry="9" fill="none" stroke="#fde047" stroke-width="1.5"/>
    <!-- Crystal Droplets / Prisms (Sparkling White & Gold) -->
    <g fill="#ffffff" stroke="#fde047" stroke-width="0.8">
      <!-- Outer Ring Prisms -->
      <polygon points="140,130 142,150 138,150"/>
      <polygon points="160,135 162,158 158,158"/>
      <polygon points="180,138 182,165 178,165"/>
      <polygon points="200,140 202,170 198,170"/>
      <polygon points="220,138 222,165 218,165"/>
      <polygon points="240,135 242,158 238,158"/>
      <polygon points="260,130 262,150 258,150"/>
      <!-- Lower Tier Prisms -->
      <polygon points="175,165 177,185 173,185"/>
      <polygon points="200,168 202,192 198,192"/>
      <polygon points="225,165 227,185 223,185"/>
      <!-- Center Bottom Crystal Sphere -->
      <circle cx="200" cy="205" r="5" fill="#fef08a"/>
    </g>

    <!-- Glowing Candle Lights on Chandelier -->
    <g fill="#ffffff">
      <circle cx="140" cy="125" r="3"/>
      <circle cx="170" cy="133" r="3"/>
      <circle cx="200" cy="135" r="3.5"/>
      <circle cx="230" cy="133" r="3"/>
      <circle cx="260" cy="125" r="3"/>
    </g>

    <!-- Toasting Champagne Flutes (Celebrating 25 Years) -->
    <g transform="translate(145, 250)">
      <!-- Left Glass (Tilted) -->
      <g transform="rotate(15 35 70)">
        <path d="M25 40 L45 40 L40 75 L30 75 Z" fill="#fef08a" opacity="0.6" stroke="#fde047" stroke-width="1.2"/>
        <line x1="35" y1="75" x2="35" y2="105" stroke="#fde047" stroke-width="1.5"/>
        <ellipse cx="35" cy="105" rx="14" ry="4" fill="#fde047"/>
        <!-- Golden Bubbles -->
        <circle cx="33" cy="50" r="1.5" fill="#ffffff"/>
        <circle cx="37" cy="58" r="1.2" fill="#ffffff"/>
        <circle cx="34" cy="66" r="1.5" fill="#ffffff"/>
      </g>

      <!-- Right Glass (Tilted to clink) -->
      <g transform="rotate(-15 75 70)">
        <path d="M65 40 L85 40 L80 75 L70 75 Z" fill="#fef08a" opacity="0.6" stroke="#fde047" stroke-width="1.2"/>
        <line x1="75" y1="75" x2="75" y2="105" stroke="#fde047" stroke-width="1.5"/>
        <ellipse cx="75" cy="105" rx="14" ry="4" fill="#fde047"/>
        <!-- Golden Bubbles -->
        <circle cx="73" cy="52" r="1.5" fill="#ffffff"/>
        <circle cx="77" cy="60" r="1.2" fill="#ffffff"/>
        <circle cx="74" cy="68" r="1.5" fill="#ffffff"/>
      </g>

      <!-- Clink Spark / Silver Jubilee Star -->
      <g transform="translate(55, 35)">
        <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#ffffff"/>
      </g>
    </g>

    <!-- Ornate Dining Table Silhouette & Candelabras -->
    <path d="M40 380 L360 380 L370 420 L30 420 Z" fill="#1e1b4b" stroke="#fde047" stroke-width="1.5"/>
    <rect x="50" y="380" width="300" height="6" fill="#fde047" opacity="0.8"/>

    <!-- Candelabras on Table -->
    <!-- Left Candelabra -->
    <g transform="translate(80, 325)">
      <line x1="20" y1="55" x2="20" y2="20" stroke="#fde047" stroke-width="2"/>
      <path d="M10 32 C10 40 30 40 30 32" stroke="#fde047" stroke-width="1.5" fill="none"/>
      <!-- Flames -->
      <circle cx="10" cy="28" r="3" fill="#fef08a"/>
      <circle cx="20" cy="16" r="3.5" fill="#fef08a"/>
      <circle cx="30" cy="28" r="3" fill="#fef08a"/>
    </g>

    <!-- Right Candelabra -->
    <g transform="translate(280, 325)">
      <line x1="20" y1="55" x2="20" y2="20" stroke="#fde047" stroke-width="2"/>
      <path d="M10 32 C10 40 30 40 30 32" stroke="#fde047" stroke-width="1.5" fill="none"/>
      <!-- Flames -->
      <circle cx="10" cy="28" r="3" fill="#fef08a"/>
      <circle cx="20" cy="16" r="3.5" fill="#fef08a"/>
      <circle cx="30" cy="28" r="3" fill="#fef08a"/>
    </g>

    <!-- Silver & Gold Confetti Floating in Ballroom -->
    <g fill="#ffffff" opacity="0.85">
      <circle cx="90" cy="200" r="2"/>
      <circle cx="130" cy="230" r="1.5"/>
      <circle cx="270" cy="210" r="2.5"/>
      <circle cx="310" cy="240" r="2"/>
      <circle cx="180" cy="270" r="1.5"/>
      <circle cx="220" cy="280" r="2"/>
    </g>
    <g fill="#fde047" opacity="0.75">
      <circle cx="70" cy="240" r="2.5"/>
      <circle cx="330" cy="210" r="2"/>
      <circle cx="110" cy="280" r="2"/>
      <circle cx="290" cy="270" r="1.8"/>
    </g>

    <!-- Ballroom Floor Base -->
    <rect y="420" width="400" height="60" fill="#0f172a"/>
    <line x1="0" y1="420" x2="400" y2="420" stroke="#fde047" stroke-width="2"/>
  </g>
</svg>