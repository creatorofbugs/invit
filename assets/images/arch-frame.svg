<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="35%" stop-color="#e5b85a"/>
      <stop offset="70%" stop-color="#c2912e"/>
      <stop offset="100%" stop-color="#845914"/>
    </linearGradient>
    <linearGradient id="innerBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997320"/>
    </linearGradient>
    <filter id="archShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ornate Scalloped Mughal/Rajasthani Arch Outer Contour -->
  <path d="M40 460 L40 200 C40 130 90 60 200 40 C310 60 360 130 360 200 L360 460 Z" stroke="url(#goldArch)" stroke-width="6" fill="none" filter="url(#archShadow)"/>
  
  <!-- Secondary Inner Gold Bead String -->
  <path d="M52 455 L52 205 C52 140 98 75 200 56 C302 75 348 140 348 205 L348 455 Z" stroke="url(#goldArch)" stroke-width="1.8" stroke-dasharray="3,4" fill="none"/>

  <!-- Scalloped Multi-Cusp Arch Lines (Iconic Rajput Jharokha Arch) -->
  <path d="M65 240 
           C65 210 85 190 105 190 
           C105 160 130 140 155 140 
           C160 110 185 85 200 80 
           C215 85 240 110 245 140 
           C270 140 295 160 295 190 
           C315 190 335 210 335 240" 
        stroke="url(#goldArch)" stroke-width="2.5" fill="none"/>

  <!-- Ornate Arch Top Finial / Kalash -->
  <path d="M200 20 L204 40 L196 40 Z" fill="url(#goldArch)"/>
  <circle cx="200" cy="18" r="4" fill="url(#goldArch)"/>

  <!-- Corner Floral Arabesques (Spandrels) -->
  <!-- Top Left Corner -->
  <g fill="none" stroke="url(#goldArch)" stroke-width="1.5">
    <path d="M42 42 C70 42 85 70 85 100"/>
    <circle cx="85" cy="100" r="3" fill="url(#goldArch)"/>
    <path d="M55 55 C70 55 78 70 78 85"/>
  </g>
  <!-- Top Right Corner -->
  <g fill="none" stroke="url(#goldArch)" stroke-width="1.5">
    <path d="M358 42 C330 42 315 70 315 100"/>
    <circle cx="315" cy="100" r="3" fill="url(#goldArch)"/>
    <path d="M345 55 C330 55 322 70 322 85"/>
  </g>

  <!-- Bottom Decorative Base Molding -->
  <path d="M30 460 L370 460" stroke="url(#goldArch)" stroke-width="4"/>
  <path d="M20 468 L380 468" stroke="url(#goldArch)" stroke-width="2"/>
</svg>