<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="sangeetBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b1d11"/>
      <stop offset="40%" stop-color="#6d3014"/>
      <stop offset="80%" stop-color="#9a4d1a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="musicAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#92400e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="archClip">
      <path d="M40 460 L40 200 C40 130 90 60 200 40 C310 60 360 130 360 200 L360 460 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#archClip)">
    <!-- Heritage Parchment Canvas -->
    <rect width="400" height="480" fill="url(#sangeetBg)"/>

    <!-- Arch Background Glow -->
    <circle cx="200" cy="220" r="160" fill="url(#musicAura)"/>

    <!-- Royal Palace Pavilion Pillars in Background -->
    <g opacity="0.4" stroke="#ffd185" stroke-width="2">
      <line x1="80" y1="120" x2="80" y2="400"/>
      <line x1="120" y1="100" x2="120" y2="400"/>
      <line x1="280" y1="100" x2="280" y2="400"/>
      <line x1="320" y1="120" x2="320" y2="400"/>
      <path d="M120 160 C150 130 250 130 280 160" fill="none" stroke-width="2.5"/>
    </g>

    <!-- Hanging Brass Bells & Diyas -->
    <g stroke="#fef08a" stroke-width="1.2">
      <line x1="140" y1="60" x2="140" y2="170"/>
      <polygon points="135,170 145,170 140,185" fill="#f59e0b"/>
      <circle cx="140" cy="188" r="3" fill="#ffffff"/>

      <line x1="260" y1="60" x2="260" y2="170"/>
      <polygon points="255,170 265,170 260,185" fill="#f59e0b"/>
      <circle cx="260" cy="188" r="3" fill="#ffffff"/>

      <line x1="200" y1="40" x2="200" y2="140"/>
      <polygon points="194,140 206,140 200,160" fill="#f59e0b"/>
      <circle cx="200" cy="164" r="4" fill="#ffffff"/>
    </g>

    <!-- Miniature Art Courtyard Musicians & Dancers -->
    <!-- Center Sitar & Flute Instruments (Detailed Royal Vector) -->
    <g transform="translate(140, 240)">
      <!-- Sitar Gourd & Neck -->
      <path d="M40 140 C10 140 0 110 20 85 C35 65 65 65 80 85 C100 110 90 140 60 140 Z" fill="#78350f" stroke="#fde68a" stroke-width="2"/>
      <path d="M50 85 L50 -40" stroke="#fde68a" stroke-width="5"/>
      <path d="M50 -40 L45 -70 L55 -70 Z" fill="#92400e" stroke="#fde68a" stroke-width="1.5"/>
      <!-- Sitar Tuning Pegs -->
      <line x1="38" y1="-50" x2="62" y2="-50" stroke="#fde68a" stroke-width="2"/>
      <line x1="38" y1="-30" x2="62" y2="-30" stroke="#fde68a" stroke-width="2"/>
      <!-- Strings -->
      <line x1="48" y1="-65" x2="48" y2="110" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
      <line x1="50" y1="-65" x2="50" y2="110" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
      <line x1="52" y1="-65" x2="52" y2="110" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
    </g>

    <!-- Pair of Classical Tabla Drums -->
    <g transform="translate(230, 320)">
      <!-- Left Dayan -->
      <ellipse cx="25" cy="55" rx="20" ry="12" fill="#451a03" stroke="#fde68a" stroke-width="1.5"/>
      <ellipse cx="25" cy="53" rx="9" ry="5" fill="#18181b"/>
      <path d="M7 58 C10 85 40 85 43 58 Z" fill="#b45309" stroke="#fde68a" stroke-width="1"/>
      <!-- Right Bayan (Metal/Bass) -->
      <ellipse cx="65" cy="60" rx="25" ry="14" fill="#64748b" stroke="#fde68a" stroke-width="1.5"/>
      <ellipse cx="68" cy="58" rx="11" ry="6" fill="#18181b"/>
      <path d="M42 63 C48 95 86 95 90 63 Z" fill="#475569" stroke="#fde68a" stroke-width="1"/>
    </g>

    <!-- Marigold Garland Drops -->
    <g fill="#f59e0b">
      <circle cx="80" cy="180" r="5"/>
      <circle cx="82" cy="195" r="5" fill="#ef4444"/>
      <circle cx="80" cy="210" r="5"/>
      <circle cx="82" cy="225" r="5" fill="#ef4444"/>
      <circle cx="80" cy="240" r="5"/>
      <circle cx="320" cy="180" r="5"/>
      <circle cx="318" cy="195" r="5" fill="#ef4444"/>
      <circle cx="320" cy="210" r="5"/>
      <circle cx="318" cy="225" r="5" fill="#ef4444"/>
      <circle cx="320" cy="240" r="5"/>
    </g>

    <!-- Golden Music Soundwaves & Stars -->
    <g fill="#ffffff" opacity="0.85">
      <circle cx="160" cy="180" r="2"/>
      <circle cx="240" cy="190" r="2.5"/>
      <circle cx="190" cy="210" r="1.5"/>
      <circle cx="270" cy="260" r="2"/>
      <path d="M110 280 C130 260 170 290 190 270" stroke="#fef08a" stroke-width="1.2" fill="none" opacity="0.5"/>
      <path d="M210 240 C230 220 270 250 290 230" stroke="#fef08a" stroke-width="1.2" fill="none" opacity="0.5"/>
    </g>

    <!-- Carpet Platform & Floor -->
    <rect y="410" width="400" height="70" fill="#782410"/>
    <line x1="0" y1="410" x2="400" y2="410" stroke="#fde68a" stroke-width="2"/>
    <g fill="#fde68a" opacity="0.7">
      <!-- Paisley motifs along rug border -->
      <circle cx="50" cy="425" r="4"/>
      <circle cx="100" cy="425" r="4"/>
      <circle cx="150" cy="425" r="4"/>
      <circle cx="200" cy="425" r="4"/>
      <circle cx="250" cy="425" r="4"/>
      <circle cx="300" cy="425" r="4"/>
      <circle cx="350" cy="425" r="4"/>
    </g>
  </g>
</svg>