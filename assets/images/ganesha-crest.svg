<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Subtle Outer Glow -->
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf4d7" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#dfb15b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9a7122" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="35%" stop-color="#e8be66"/>
      <stop offset="70%" stop-color="#cf9d38"/>
      <stop offset="100%" stop-color="#916a1b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Aura Background -->
  <circle cx="100" cy="115" r="85" fill="url(#goldGlow)" />
  <circle cx="100" cy="115" r="82" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
  <circle cx="100" cy="115" r="76" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>

  <!-- Ornate Crown (Mukut) -->
  <g filter="url(#shadow)" fill="url(#goldGrad)">
    <path d="M100 25 L106 42 L118 36 L112 55 L124 54 L114 68 L100 64 L86 68 L76 54 L88 55 L82 36 L94 42 Z"/>
    <circle cx="100" cy="22" r="3" />
    <circle cx="100" cy="46" r="2.5" fill="#fdf4d7"/>
    <circle cx="88" cy="50" r="1.5" fill="#fdf4d7"/>
    <circle cx="112" cy="50" r="1.5" fill="#fdf4d7"/>

    <!-- Auspicious Tilak / Trishul / Om symbol on forehead -->
    <path d="M100 58 C98 64 94 67 93 72 C98 70 102 70 107 72 C106 67 102 64 100 58 Z" />
    <circle cx="100" cy="67" r="2.2" fill="#be2a2a"/>

    <!-- Ganesha Head & Trunk (Iconic Minimalist Royal Silhouette) -->
    <!-- Large Ears -->
    <!-- Left Ear (viewer left) -->
    <path d="M85 70 C68 66 52 76 54 94 C56 108 72 114 84 112 C82 102 83 85 85 70 Z" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M80 77 C68 76 60 84 62 96 C64 104 72 107 80 106" stroke="url(#goldGrad)" stroke-width="0.8" fill="none" opacity="0.7"/>

    <!-- Right Ear (viewer right) -->
    <path d="M115 70 C132 66 148 76 146 94 C144 108 128 114 116 112 C118 102 117 85 115 70 Z" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M120 77 C132 76 140 84 138 96 C136 104 128 107 120 106" stroke="url(#goldGrad)" stroke-width="0.8" fill="none" opacity="0.7"/>

    <!-- Head & Trunk Flow -->
    <path d="M88 74 C94 71 106 71 112 74 C115 84 114 96 110 108 C106 122 107 134 116 142 C124 150 134 146 136 138 C137 132 133 126 127 128 C123 129 122 134 124 137 C120 140 114 136 112 130 C108 120 104 105 106 94 C107 88 105 84 100 84 C95 84 93 88 94 94 C96 105 92 120 88 130 C86 136 80 140 76 137 C78 134 77 129 73 128 C67 126 63 132 64 138 C66 146 76 150 84 142 C93 134 94 122 90 108 C86 96 85 84 88 74 Z"/>

    <!-- Small Modak in Trunk tip -->
    <circle cx="132" cy="133" r="3.5" fill="#fdf4d7" />

    <!-- Tusk (Ekdant) -->
    <path d="M93 103 L84 105 L92 108 Z" fill="#ffffff"/>
    <path d="M107 103 L113 105 L108 107 Z" fill="#ffffff" opacity="0.7"/>

    <!-- Eyes (Gentle, Benevolent) -->
    <ellipse cx="92" cy="84" rx="3.5" ry="1.8" transform="rotate(-10 92 84)"/>
    <ellipse cx="108" cy="84" rx="3.5" ry="1.8" transform="rotate(10 108 84)"/>
  </g>

  <!-- Sacred Sanskrit Shloka Arch Below -->
  <text x="100" y="180" font-family="'Cinzel', 'Playfair Display', serif" font-size="13" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">॥ श्री गणेशाय नमः ॥</text>
  <text x="100" y="200" font-family="'Cinzel', 'Montserrat', serif" font-size="8.5" font-weight="500" fill="#dfb15b" text-anchor="middle" letter-spacing="4">VAKRATUNDA MAHAKAYA</text>
  <line x1="60" y1="210" x2="140" y2="210" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
  <circle cx="100" cy="210" r="2" fill="url(#goldGrad)"/>
</svg>