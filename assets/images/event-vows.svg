<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="vowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14352a"/>
      <stop offset="40%" stop-color="#1e4e3e"/>
      <stop offset="75%" stop-color="#2d6a54"/>
      <stop offset="100%" stop-color="#427d66"/>
    </linearGradient>
    <radialGradient id="vowGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14352a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="archClipVows">
      <path d="M40 460 L40 200 C40 130 90 60 200 40 C310 60 360 130 360 200 L360 460 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#archClipVows)">
    <!-- Heritage Emerald Canvas -->
    <rect width="400" height="480" fill="url(#vowBg)"/>

    <!-- Sacred Aura Glow in Center -->
    <circle cx="200" cy="220" r="160" fill="url(#vowGlow)"/>

    <!-- Royal Mandap Floral Canopy -->
    <!-- Pillars of the Mandap -->
    <g stroke="#fef08a" stroke-width="2.5">
      <!-- Left Floral Pillar -->
      <line x1="90" y1="120" x2="90" y2="420"/>
      <!-- Right Floral Pillar -->
      <line x1="310" y1="120" x2="310" y2="420"/>
    </g>

    <!-- Mandap Floral Arch Header -->
    <path d="M70 140 C140 90 260 90 330 140" stroke="#fde047" stroke-width="5" fill="none"/>
    <path d="M80 150 C145 105 255 105 320 150" stroke="#f43f5e" stroke-width="4" fill="none"/>

    <!-- Suspended Floral Garlands (Jasmine & Rose Strings) -->
    <g fill="#ffffff">
      <circle cx="110" cy="145" r="4"/>
      <circle cx="110" cy="160" r="3.5"/>
      <circle cx="110" cy="175" r="4" fill="#fb7185"/>
      <circle cx="110" cy="190" r="3.5"/>

      <circle cx="140" cy="130" r="4"/>
      <circle cx="140" cy="145" r="3.5"/>
      <circle cx="140" cy="160" r="4" fill="#fb7185"/>

      <circle cx="200" cy="115" r="5" fill="#fde047"/>
      <circle cx="200" cy="132" r="4" fill="#ffffff"/>
      <circle cx="200" cy="148" r="4.5" fill="#fb7185"/>

      <circle cx="260" cy="130" r="4"/>
      <circle cx="260" cy="145" r="3.5"/>
      <circle cx="260" cy="160" r="4" fill="#fb7185"/>

      <circle cx="290" cy="145" r="4"/>
      <circle cx="290" cy="160" r="3.5"/>
      <circle cx="290" cy="175" r="4" fill="#fb7185"/>
      <circle cx="290" cy="190" r="3.5"/>
    </g>

    <!-- Couple Exchanging Varmala (Garlands) Silhouette & Royal Regalia -->
    <!-- Husband (Sherwani & Safa/Turban) -->
    <g transform="translate(130, 210)">
      <!-- Body & Royal Sherwani -->
      <path d="M20 70 L25 170 L55 170 L55 70 Z" fill="#fdf4d7" stroke="#eab308" stroke-width="1.5"/>
      <!-- Royal Emerald Dupatta / Stole -->
      <path d="M22 80 C35 110 38 140 28 170" stroke="#047857" stroke-width="4" fill="none"/>
      <!-- Head & Safa (Rajput Royal Turban) -->
      <circle cx="38" cy="48" r="12" fill="#d97706"/>
      <!-- Feather (Kalgi) -->
      <path d="M38 32 L40 20 L43 32 Z" fill="#ffffff"/>
      <circle cx="40" cy="33" r="2" fill="#ef4444"/>
    </g>

    <!-- Wife (Lehanga & Royal Chunri) -->
    <g transform="translate(210, 215)">
      <!-- Lehanga Flared Skirt -->
      <path d="M25 90 L5 170 L55 170 L35 90 Z" fill="#be123c" stroke="#fde047" stroke-width="1.5"/>
      <!-- Blouse / Choli -->
      <rect x="22" y="65" width="16" height="25" fill="#9f1239"/>
      <!-- Odhni / Royal Veil Drape -->
      <path d="M30 42 C48 55 58 100 52 165" stroke="#f43f5e" stroke-width="5" fill="none"/>
      <!-- Head & Ornate Maang Tikka -->
      <circle cx="30" cy="48" r="11" fill="#f43f5e"/>
      <circle cx="30" cy="40" r="2.5" fill="#fde047"/>
    </g>

    <!-- Floral Garland (Varmala) connecting Couple in celebration -->
    <path d="M172 280 C185 305 195 305 235 280" stroke="#fb7185" stroke-width="5" stroke-dasharray="3,3" fill="none"/>
    <path d="M172 278 C185 303 195 303 235 278" stroke="#ffffff" stroke-width="2.5" fill="none"/>

    <!-- Sacred Kalash with Coconut & Mango Leaves in Center -->
    <g transform="translate(185, 340)">
      <circle cx="15" cy="40" r="14" fill="#d97706" stroke="#fde047" stroke-width="1.5"/>
      <!-- Swastik / Sacred symbol on pot -->
      <circle cx="15" cy="40" r="4" fill="#ef4444"/>
      <!-- Coconut -->
      <circle cx="15" cy="24" r="9" fill="#78350f"/>
      <!-- Leaves -->
      <polygon points="15,22 8,14 15,16" fill="#15803d"/>
      <polygon points="15,22 22,14 15,16" fill="#15803d"/>
      <polygon points="15,22 15,8 15,16" fill="#15803d"/>
    </g>

    <!-- Rose Petals Drifting in the Air -->
    <g fill="#f43f5e">
      <ellipse cx="120" cy="220" rx="6" ry="3" transform="rotate(25 120 220)"/>
      <ellipse cx="280" cy="200" rx="7" ry="3.5" transform="rotate(-35 280 200)"/>
      <ellipse cx="160" cy="180" rx="5" ry="2.5" transform="rotate(40 160 180)"/>
      <ellipse cx="240" cy="170" rx="6" ry="3" transform="rotate(-15 240 170)"/>
      <ellipse cx="200" cy="240" rx="5" ry="2.5" transform="rotate(20 200 240)"/>
    </g>

    <!-- Silver Jubilee Shimmer Stars -->
    <g fill="#ffffff" opacity="0.9">
      <polygon points="130,130 132,135 137,135 133,138 135,143 130,140 125,143 127,138 123,135 128,135"/>
      <polygon points="270,120 272,125 277,125 273,128 275,133 270,130 265,133 267,128 263,125 268,125"/>
    </g>

    <!-- Platform Base -->
    <rect y="420" width="400" height="60" fill="#112920"/>
    <line x1="0" y1="420" x2="400" y2="420" stroke="#fde047" stroke-width="2"/>
  </g>
</svg>